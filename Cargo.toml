[package]
name = "hbb_common"
version = "0.1.0"
authors = ["open-trade <info@opentradesolutions.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
webrtc = ["dep:webrtc"]
# vhd-machine-auth-bridge: features pass-through，使根 crate 启用 vhd-bridge 时
# hbb_common 内的 cfg(feature = "vhd-bridge") 守卫可见。
# 复用既有 sha2 / rand；hmac (0.12) 在 vhd-bridge 启用时通过 dep:hmac 拉入并由
# lib.rs 重新导出，使 src/vhd_bridge/hmac.rs 走 hbb_common::hmac 路径，避免在
# 根 crate 直接引入新密码学 crate（任务 4.2）。
vhd-bridge = ["dep:hmac"]
# vhd-machine-auth-bridge: features pass-through for `controlled-only`，使
# `libs/hbb_common/src/config.rs` 内的 `cfg(feature = "controlled-only")` 守卫
# 在根 crate 启用裁剪特性时可见（任务 17.4：裁剪最近 / 收藏 / 地址簿 /
# 主动 LAN 发现持久化与读取路径）。
controlled-only = []

[dependencies]
# new flexi_logger failed on rustc 1.75
flexi_logger = { version = "0.27", features = ["async"] }
protobuf = { version = "3.7", features = ["with-bytes"] }
tokio = { version = "1.44", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
futures = "0.3"
bytes = { version = "1.10", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
socket2 = { version = "0.3", features = ["reuseport"] }
zstd = "0.13"
anyhow = "1.0"
futures-util = "0.3"
directories-next = "2.0"
rand = "0.8"
serde_derive = "1.0"
serde = "1.0"
serde_json = "1.0"
lazy_static = "1.5"
confy = { git = "https://github.com/rustdesk-org/confy" }
dirs-next = "2.0"
filetime = "0.2"
sodiumoxide = "0.2"
regex = "1.11"
tokio-socks = { git = "https://github.com/rustdesk-org/tokio-socks" }
chrono = "0.4"
backtrace = "0.3"
libc = "0.2"
dlopen = "0.1"
toml = "0.7"
uuid = { version = "1.16", features = ["v4"] }
# new sysinfo issue: https://github.com/rustdesk/rustdesk/pull/6330#issuecomment-2270871442
sysinfo = { git = "https://github.com/rustdesk-org/sysinfo", branch = "rlim_max" }
# new flexi_logger failed on nightly rustc 1.75 for x86
thiserror = "1.0"
httparse = "1.10"
base64 = "0.22"
url = "2.5"
sha2 = "0.10"
# vhd-machine-auth-bridge: HMAC-SHA256 helper for src/vhd_bridge/hmac.rs.
# Pulled in only when the root crate enables `vhd-bridge`; re-exported
# via `pub use hmac;` in lib.rs so the bridge can write
# `hbb_common::hmac::Hmac` per task 4.2 ("复用既有 hmac/sha2"). Already
# present transitively (hkdf -> hmac) so this does not add a new crate
# to the dependency graph.
hmac = { version = "0.12", optional = true }
whoami = "1.5"

tokio-rustls = { version = "0.26", features = [
    "logging",
    "tls12",
    "ring",
], default-features = false }
tokio-native-tls = "0.3"
tokio-tungstenite = { version = "0.26", features = ["native-tls", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
tungstenite = { version = "0.26", features = ["native-tls", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
rustls-platform-verifier = "0.6"
rustls-pki-types = "1.11"
rustls-native-certs = "0.8"
webpki-roots = "1.0.4"
async-recursion = "1.1"
webrtc = { version = "0.14.0", optional = true }
libloading = "0.8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
mac_address = "1.1"
default_net = { git = "https://github.com/rustdesk-org/default_net" }
machine-uid = { git = "https://github.com/rustdesk-org/machine-uid" }

[build-dependencies]
protobuf-codegen = { version = "3.7" }
# vhd-machine-auth-bridge §1.2b: same Build_Prereq_Vars resolver as the root
# build.rs — emits `cargo:rustc-env=RUSTDESK_RS_PUB_KEY` / `..RENDEZVOUS_SERVER`
# / `..RELAY_SERVER` for the `option_env!` consumers in `src/config.rs`.
# Pure helpers, no external deps.
build_support = { path = "../build_support" }

[dev-dependencies]
clap = "4.5.51"
webrtc = "0.14.0"
# vhd-machine-auth-bridge: PBT runner for Property 11 / 13 / 21 etc.
# design.md §"Library selection" pins proptest = "1" as dev-only; no
# runtime dependency is added.
proptest = "1"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = [
    "winuser",
    "synchapi",
    "pdh",
    "memoryapi",
    "sysinfoapi",
] }

[target.'cfg(target_os = "macos")'.dependencies]
osascript = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
sctk = { package = "smithay-client-toolkit", version = "0.20.0", default-features = false, features = [
    "calloop",
] }
users = { version = "0.11" }
x11 = "2.21"
